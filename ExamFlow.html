<body><div id="root"></div>
<!-- ExamFlow feedback widget: sends feedback, feature requests and bug reports to the ExamFlow API (shown in the admin panel). -->
<style>
  .efb-btn { position: fixed; z-index: 900; left: 16px; bottom: 96px; display: none; align-items: center; gap: 6px;
    border: 1px solid #EAE7F5; background: #FFFFFF; color: #4B4560; border-radius: 999px; padding: 7px 13px;
    font: 600 13px 'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif; cursor: pointer; box-shadow: 0 2px 8px rgba(30,26,46,.08); }
  .efb-btn:hover { color: #6552F5; border-color: #6552F5; }
  .efb-btn:focus-visible, .efb-dialog :focus-visible, .efa-banner :focus-visible { outline: 2px solid #6552F5; outline-offset: 2px; }
  @media (max-width: 860px) { .efb-btn { bottom: 62px; left: 12px; padding: 6px 11px; } }
  .efb-backdrop { position: fixed; inset: 0; z-index: 950; background: rgba(18,15,31,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .efb-dialog { width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; color: #1E1A2E; border-radius: 16px; padding: 22px;
    font: 400 15px/1.5 'Manrope', system-ui, sans-serif; box-shadow: 0 20px 50px rgba(18,15,31,.25); box-sizing: border-box; }
  .efb-dialog h2 { font: 800 19px 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0 0 4px; }
  .efb-dialog p { margin: 0 0 14px; color: #4B4560; font-size: 14px; }
  .efb-kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .efb-kinds label { display: flex; align-items: center; justify-content: center; text-align: center; border: 1px solid #EAE7F5; border-radius: 10px; padding: 8px 6px; cursor: pointer; font-weight: 600; font-size: 13px; line-height: 1.25; }
  .efb-kinds input { position: absolute; opacity: 0; pointer-events: none; }
  .efb-kinds label:has(input:checked) { border-color: #6552F5; background: #F0EEFE; color: #5140D6; }
  .efb-kinds label:has(input:focus-visible) { outline: 2px solid #6552F5; outline-offset: 2px; }
  .efb-field { display: block; font-weight: 600; font-size: 13px; color: #4B4560; margin: 10px 0 5px; }
  .efb-dialog select, .efb-dialog input[type=text], .efb-dialog textarea { width: 100%; box-sizing: border-box; border: 1px solid #EAE7F5; border-radius: 10px; padding: 9px 12px; font: inherit; color: inherit; background: #fff; }
  .efb-dialog textarea { min-height: 110px; resize: vertical; }
  .efb-dialog select:focus, .efb-dialog input[type=text]:focus, .efb-dialog textarea:focus { outline: none; border-color: #6552F5; }
  .efb-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
  .efb-status { font-size: 13px; color: #8985A6; }
  .efb-status.err { color: #B91C1C; }
  .efb-actions { display: flex; gap: 8px; }
  .efb-actions button { border: 0; border-radius: 10px; padding: 9px 15px; font: 700 14px 'Manrope', system-ui, sans-serif; cursor: pointer; }
  .efb-cancel { background: transparent; color: #4B4560; }
  .efb-send { background: #6552F5; color: #fff; }
  .efb-send:disabled { opacity: .6; cursor: default; }
  .efa-banner { position: fixed; z-index: 890; top: 12px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); box-sizing: border-box;
    display: none; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid #EAE7F5; background: #FFFFFF; color: #1E1A2E;
    font: 400 14px/1.45 'Manrope', system-ui, sans-serif; box-shadow: 0 10px 30px rgba(30,26,46,.12); }
  .efa-banner .efa-tag { flex: none; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #F0EEFE; color: #5140D6; margin-top: 1px; }
  .efa-banner.important .efa-tag { background: #FDECEC; color: #B91C1C; }
  .efa-banner.maintenance .efa-tag { background: #FEF3C7; color: #92400E; }
  .efa-banner.feature_update .efa-tag { background: #DCFBF4; color: #0F766E; }
  .efa-banner b { display: block; font: 700 14px 'Plus Jakarta Sans', system-ui, sans-serif; }
  .efa-banner .efa-body { flex: 1; min-width: 0; word-wrap: break-word; }
  .efa-banner .efa-msg { white-space: pre-wrap; }
  .efa-banner button { flex: none; border: 0; background: transparent; color: #8985A6; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  @media (prefers-color-scheme: dark) {
    .efb-btn, .efa-banner { background: #1A1630; border-color: #332C56; color: #CBC7E6; }
    .efa-banner { color: #F3F1FB; }
    .efb-dialog { background: #1A1630; color: #F3F1FB; }
    .efb-dialog p, .efb-cancel, .efb-field { color: #CBC7E6; }
    .efb-kinds label, .efb-dialog textarea, .efb-dialog select, .efb-dialog input[type=text] { border-color: #332C56; }
    .efb-dialog textarea, .efb-dialog select, .efb-dialog input[type=text] { background: #120F1F; }
    .efb-kinds label:has(input:checked) { background: #221D40; color: #8A7BFF; border-color: #8A7BFF; }
  }
</style>
<script>
(() => {
  const API = "https://examflow-api-n1gh.onrender.com";
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const inApp = () => !!document.querySelector(".ef-sidebar, .ef-bottomnav");

  /* ---------- feedback button ---------- */
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "efb-btn"; btn.textContent = "💬 Feedback";
  btn.setAttribute("aria-haspopup", "dialog");

  const back = document.createElement("div");
  back.className = "efb-backdrop";
  back.innerHTML =
    '<div class="efb-dialog" role="dialog" aria-modal="true" aria-labelledby="efb-title">' +
      '<h2 id="efb-title">Send feedback</h2>' +
      '<p>Share an idea, ask for a feature, or tell us about something that isn\'t working.</p>' +
      '<div class="efb-kinds" role="radiogroup" aria-label="Type of message">' +
        '<label><input type="radio" name="efb-kind" value="feedback" checked>Feedback</label>' +
        '<label><input type="radio" name="efb-kind" value="feature">Feature request</label>' +
        '<label><input type="radio" name="efb-kind" value="bug">Report a bug</label>' +
      '</div>' +
      '<div id="efb-cat-wrap"><label class="efb-field" for="efb-cat">Topic</label>' +
        '<select id="efb-cat"><option value="general">General feedback</option><option value="suggestion">Suggestion</option><option value="other">Other</option></select></div>' +
      '<div id="efb-title-wrap" hidden><label class="efb-field" for="efb-titlein" id="efb-title-label">Title</label>' +
        '<input type="text" id="efb-titlein" maxlength="150"></div>' +
      '<label class="efb-field" for="efb-msg" id="efb-msg-label">Your message</label>' +
      '<textarea id="efb-msg" maxlength="4000"></textarea>' +
      '<div class="efb-row"><span class="efb-status" id="efb-status" role="status"></span>' +
        '<div class="efb-actions"><button type="button" class="efb-cancel" id="efb-cancel">Cancel</button>' +
        '<button type="button" class="efb-send" id="efb-send">Send</button></div></div>' +
    '</div>';

  const COPY = {
    feedback: { title: null, label: "Your message", ph: "What would you like to share?" },
    feature: { title: "Feature you'd like", titlePh: "For example: dark mode for the planner", label: "How would it help you?", ph: "Describe the feature and how you'd use it." },
    bug: { title: "What went wrong?", titlePh: "For example: focus timer stops at 0", label: "Details", ph: "What did you do, what happened, and what did you expect?" },
  };

  /* ---------- announcement banner ---------- */
  const banner = document.createElement("div");
  banner.className = "efa-banner"; banner.setAttribute("role", "status");
  const TYPE_LABEL = { general: "Update", feature_update: "New", maintenance: "Maintenance", important: "Important" };
  let announcement = null;
  function dismissed() { try { return JSON.parse(get("examflow-dismissed-announcements") || "[]"); } catch (e) { return []; } }
  function renderBanner() {
    if (!announcement || !inApp()) { banner.style.display = "none"; return; }
    banner.className = "efa-banner " + (TYPE_LABEL[announcement.type] ? announcement.type : "general");
    banner.innerHTML = "";
    const tag = document.createElement("span"); tag.className = "efa-tag"; tag.textContent = TYPE_LABEL[announcement.type] || "Update";
    const body = document.createElement("div"); body.className = "efa-body";
    const t = document.createElement("b"); t.textContent = announcement.title;
    const m = document.createElement("div"); m.className = "efa-msg"; m.textContent = announcement.message;
    body.append(t, m);
    const x = document.createElement("button"); x.type = "button"; x.setAttribute("aria-label", "Dismiss announcement"); x.textContent = "×";
    x.onclick = () => {
      const d = dismissed(); d.push(announcement.id); set("examflow-dismissed-announcements", JSON.stringify(d.slice(-50)));
      announcement = null; banner.style.display = "none";
    };
    banner.append(tag, body, x);
    banner.style.display = "flex";
  }
  async function loadAnnouncement() {
    try {
      const r = await fetch(API + "/api/announcements");
      if (!r.ok) return;
      const data = await r.json();
      const seen = dismissed();
      announcement = (data.items || []).find((a) => !seen.includes(a.id)) || null;
      renderBanner();
    } catch (e) { /* announcements are optional; ExamFlow works without them */ }
  }

  function mount() {
    if (!document.body) return;
    document.body.append(btn, back, banner);
    const $ = (id) => back.querySelector("#" + id);
    const msg = $("efb-msg"), status = $("efb-status"), send = $("efb-send"), titleIn = $("efb-titlein");
    const kind = () => back.querySelector('input[name="efb-kind"]:checked').value;
    function applyKind() {
      const k = kind(), c = COPY[k];
      $("efb-cat-wrap").hidden = k !== "feedback";
      $("efb-title-wrap").hidden = !c.title;
      if (c.title) { $("efb-title-label").textContent = c.title; titleIn.placeholder = c.titlePh; }
      $("efb-msg-label").textContent = c.label; msg.placeholder = c.ph;
      status.textContent = ""; status.className = "efb-status";
    }
    back.querySelectorAll('input[name="efb-kind"]').forEach((r) => r.addEventListener("change", applyKind));
    applyKind();

    let wasInApp = false;
    const sync = () => {
      const now = inApp();
      btn.style.display = now ? "inline-flex" : "none";
      if (now && !wasInApp) loadAnnouncement();
      if (!now) banner.style.display = "none";
      wasInApp = now;
    };
    sync();
    new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });

    const open = () => { back.style.display = "flex"; applyKind(); (titleIn.offsetParent ? titleIn : msg).focus(); };
    const close = () => { back.style.display = "none"; btn.focus(); };
    btn.addEventListener("click", open);
    $("efb-cancel").addEventListener("click", close);
    back.addEventListener("click", (e) => { if (e.target === back) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && back.style.display === "flex") close(); });

    send.addEventListener("click", async () => {
      const k = kind(), text = msg.value.trim(), title = titleIn.value.trim();
      if (COPY[k].title && !title) { status.className = "efb-status err"; status.textContent = "Add a short title first."; titleIn.focus(); return; }
      if (!text) { status.className = "efb-status err"; status.textContent = "Write a message first."; msg.focus(); return; }
      const active = document.querySelector(".ef-sidebar .active, .ef-sidebar [aria-current], .ef-bottomnav .active, .ef-bottomnav [aria-current]");
      const token = get("examflow-token");
      const body = { kind: k, message: text, deviceId: get("examflow-device-id"), page: active ? active.textContent.trim().slice(0, 60) : location.pathname };
      if (k === "feedback") body.category = $("efb-cat").value;
      if (COPY[k].title) body.title = title;
      send.disabled = true; status.className = "efb-status"; status.textContent = "Sending…";
      try {
        const res = await fetch(API + "/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Couldn't send your message. Please try again.");
        msg.value = ""; titleIn.value = "";
        status.textContent = k === "bug" ? "Thanks, we'll look into it." : k === "feature" ? "Thanks for the idea!" : "Sent. Thank you!";
        setTimeout(close, 1300);
      } catch (e) {
        status.className = "efb-status err";
        status.textContent = e.message && e.message !== "Failed to fetch" ? e.message : "Couldn't reach ExamFlow. Check your connection and try again.";
      } finally {
        send.disabled = false;
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<style>@media (max-width: 860px){ .efb-btn{ bottom: 96px !important; } .efa-banner{ top: 70px !important; } } @media (min-width: 861px){ .efb-btn{ left: auto !important; right: 96px !important; bottom: 36px !important; } }</style>
</body>
</html>
