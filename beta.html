<!-- ExamFlow feedback widget: sends feedback, feature requests and bug reports to the ExamFlow API (shown in the admin panel). -->

      '<div id="efb-title-wrap" hidden><label class="efb-field" for="efb-titlein" id="efb-title-label">Title</label>' +
        '<input type="text" id="efb-titlein" maxlength="150"></div>' +
      '<label class="efb-field" for="efb-msg" id="efb-msg-label">Your message</label>' +
      '<textarea id="efb-msg" maxlength="4000"></textarea>' +
      '<div class="efb-row"><span class="efb-status" id="efb-status" role="status"></span>' +
        '<div class="efb-actions"><button type="button" class="efb-cancel" id="efb-cancel">Cancel</button>' +
        '<button type="button" class="efb-send" id="efb-send">Send</button></div></div>' +
    '</div>';

  const COPY = {
    feedback: { title: null, label: "Your message", ph: "What would you like to share?" },
    feature: { title: "Feature you'd like", titlePh: "For example: dark mode for the planner", label: "How would it help you?", ph: "Describe the feature and how you'd use it." },
    bug: { title: "What went wrong?", titlePh: "For example: focus timer stops at 0", label: "Details", ph: "What did you do, what happened, and what did you expect?" },
  };

  /* ---------- announcement banner ---------- */
  const banner = document.createElement("div");
  banner.className = "efa-banner"; banner.setAttribute("role", "status");
  const TYPE_LABEL = { general: "Update", feature_update: "New", maintenance: "Maintenance", important: "Important" };
  let announcement = null;
  function dismissed() { try { return JSON.parse(get("examflow-dismissed-announcements") || "[]"); } catch (e) { return []; } }
  function renderBanner() {
    if (!announcement || !inApp()) { banner.style.display = "none"; return; }
    banner.className = "efa-banner " + (TYPE_LABEL[announcement.type] ? announcement.type : "general");
    banner.innerHTML = "";
    const tag = document.createElement("span"); tag.className = "efa-tag"; tag.textContent = TYPE_LABEL[announcement.type] || "Update";
    const body = document.createElement("div"); body.className = "efa-body";
    const t = document.createElement("b"); t.textContent = announcement.title;
    const m = document.createElement("div"); m.className = "efa-msg"; m.textContent = announcement.message;
    body.append(t, m);
    const x = document.createElement("button"); x.type = "button"; x.setAttribute("aria-label", "Dismiss announcement"); x.textContent = "×";
    x.onclick = () => {
      const d = dismissed(); d.push(announcement.id); set("examflow-dismissed-announcements", JSON.stringify(d.slice(-50)));
      announcement = null; banner.style.display = "none";
    };
    banner.append(tag, body, x);
    banner.style.display = "flex";
  }
  async function loadAnnouncement() {
    try {
      const r = await fetch(API + "/api/announcements");
      if (!r.ok) return;
      const data = await r.json();
      const seen = dismissed();
      announcement = (data.items || []).find((a) => !seen.includes(a.id)) || null;
      renderBanner();
    } catch (e) { /* announcements are optional; ExamFlow works without them */ }
  }

  function mount() {
    if (!document.body) return;
    document.body.append(btn, back, banner);
    const $ = (id) => back.querySelector("#" + id);
    const msg = $("efb-msg"), status = $("efb-status"), send = $("efb-send"), titleIn = $("efb-titlein");
    const kind = () => back.querySelector('input[name="efb-kind"]:checked').value;
    function applyKind() {
      const k = kind(), c = COPY[k];
      $("efb-cat-wrap").hidden = k !== "feedback";
      $("efb-title-wrap").hidden = !c.title;
      if (c.title) { $("efb-title-label").textContent = c.title; titleIn.placeholder = c.titlePh; }
      $("efb-msg-label").textContent = c.label; msg.placeholder = c.ph;
      status.textContent = ""; status.className = "efb-status";
    }
    back.querySelectorAll('input[name="efb-kind"]').forEach((r) => r.addEventListener("change", applyKind));
    applyKind();

    let wasInApp = false;
    const sync = () => {
      const now = inApp();
      btn.style.display = now ? "inline-flex" : "none";
      if (now && !wasInApp) loadAnnouncement();
      if (!now) banner.style.display = "none";
      wasInApp = now;
    };
    sync();
    new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });

    const open = () => { back.style.display = "flex"; applyKind(); (titleIn.offsetParent ? titleIn : msg).focus(); };
    const close = () => { back.style.display = "none"; btn.focus(); };
    btn.addEventListener("click", open);
    $("efb-cancel").addEventListener("click", close);
    back.addEventListener("click", (e) => { if (e.target === back) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && back.style.display === "flex") close(); });

    send.addEventListener("click", async () => {
      const k = kind(), text = msg.value.trim(), title = titleIn.value.trim();
      if (COPY[k].title && !title) { status.className = "efb-status err"; status.textContent = "Add a short title first."; titleIn.focus(); return; }
      if (!text) { status.className = "efb-status err"; status.textContent = "Write a message first."; msg.focus(); return; }
      const active = document.querySelector(".ef-sidebar .active, .ef-sidebar [aria-current], .ef-bottomnav .active, .ef-bottomnav [aria-current]");
      const token = get("examflow-token");
      const body = { kind: k, message: text, deviceId: get("examflow-device-id"), page: active ? active.textContent.trim().slice(0, 60) : location.pathname };
      if (k === "feedback") body.category = $("efb-cat").value;
      if (COPY[k].title) body.title = title;
      send.disabled = true; status.className = "efb-status"; status.textContent = "Sending…";
      try {
        const res = await fetch(API + "/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Couldn't send your message. Please try again.");
        msg.value = ""; titleIn.value = "";
        status.textContent = k === "bug" ? "Thanks, we'll look into it." : k === "feature" ? "Thanks for the idea!" : "Sent. Thank you!";
        setTimeout(close, 1300);
      } catch (e) {
        status.className = "efb-status err";
        status.textContent = e.message && e.message !== "Failed to fetch" ? e.message : "Couldn't reach ExamFlow. Check your connection and try again.";
      } finally {
        send.disabled = false;
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
})();
</script>

<style>@media (max-width: 860px){ .efb-btn{ bottom: 96px !important; } .efa-banner{ top: 70px !important; } } @media (min-width: 861px){ .efb-btn{ left: 22px !important; bottom: 104px !important; } }</style>
</body>
</html>
