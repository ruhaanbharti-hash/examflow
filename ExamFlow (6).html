@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F6FC; --surface:#FFFFFF; --surface-2:#F0F1FA;
  --ink:#201B34; --ink-soft:#4B4560; --muted:#8583A0;
  --indigo:#5B4FE8; --indigo-dark:#463CC4; --violet:#8B5CF6; --blue:#3E7BFA;
  --green:#16A34A; --green-soft:#DCFCE7;
  --amber:#F59E0B; --amber-soft:#FEF3C7;
  --red:#EF4444; --red-soft:#FEE2E2;
  --border:#E6E5F3; --shadow:0 10px 30px -14px rgba(91,79,232,0.25);
}
:root[data-theme="dark"]{
  --bg:#131120; --surface:#1C1932; --surface-2:#242040;
  --ink:#F1F0FA; --ink-soft:#C7C3E3; --muted:#8B87AE;
  --indigo:#7C72F5; --indigo-dark:#6459E8; --violet:#A48FFF; --blue:#5C8CFF;
  --green:#22C55E; --green-soft:#123321;
  --amber:#FBBF24; --amber-soft:#3A2C0C;
  --red:#F87171; --red-soft:#3A1414;
  --border:#332E52; --shadow:0 10px 30px -14px rgba(0,0,0,0.5);
}
:root[data-theme="dark"] .ef-input{background:var(--surface-2);color:var(--ink);}
:root[data-theme="dark"] .ef-hero-preview-body{background:var(--surface);}
:root[data-theme="dark"] .ef-feature-card{background:var(--surface);}
*{box-sizing:border-box;}
.ef-app, .ef-loading{font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);}
.ef-loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.ef-loading p{color:var(--muted);font-size:14px;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;}

.ef-app{display:flex;min-height:100vh;width:100%;}
.ef-main{flex:1;min-width:0;padding:24px 28px 100px;}
.ef-page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:ef-fade-in .25s ease;}
@keyframes ef-fade-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Sidebar */
.ef-sidebar{width:224px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.ef-brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;}
.ef-brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;}
.ef-brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
.ef-nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.ef-navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:background .15s ease, color .15s ease;}
.ef-navitem:hover{background:var(--surface-2);}
.ef-navitem-active{background:var(--indigo);color:#fff;}
.ef-streak-pill{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);font-size:13px;font-weight:600;color:#92400E;}

@media(min-width:900px){
  .ef-sidebar{display:flex;}
  .ef-bottomnav{display:none !important;}
  .ef-main{padding:32px 40px 60px;}
}

/* Bottom nav */
.ef-bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 2px;z-index:40;}
.ef-bottomitem{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font-size:10px;padding:4px 2px;cursor:pointer;flex:1;transition:color .15s ease;}
.ef-bottomitem-active{color:var(--indigo);}

/* Page head */
.ef-page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;}
.ef-eyebrow{font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin:0 0 2px;}
.ef-title{font-size:26px;font-weight:700;}
.ef-h3{font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.ef-h4{font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.ef-quickactions{display:flex;gap:8px;flex-wrap:wrap;}

/* Buttons */
.ef-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:11px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:transform .08s ease, box-shadow .15s ease;}
.ef-btn:active{transform:scale(0.97);}
.ef-btn-primary{background:var(--indigo);color:#fff;box-shadow:var(--shadow);}
.ef-btn-primary:hover{background:var(--indigo-dark);}
.ef-btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.ef-btn-ghost{background:var(--surface-2);color:var(--ink-soft);}
.ef-btn-ghost:hover{background:#E5E4F5;}
.ef-btn-danger{background:var(--red-soft);color:#B91C1C;}
.ef-btn-block{width:100%;justify-content:center;margin-top:6px;}
.ef-btn-sm{padding:6px 10px;font-size:12.5px;}
.ef-link{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--indigo);font-weight:600;font-size:13px;cursor:pointer;padding:0;}
.ef-link-sm{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ef-iconbtn{width:28px;height:28px;border-radius:8px;border:none;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.ef-iconbtn:hover{background:#E5E4F5;}
.ef-iconbtn-danger:hover{background:var(--red-soft);color:#B91C1C;}
.ef-fab{position:fixed;right:22px;bottom:84px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;box-shadow:0 12px 28px -8px rgba(91,79,232,0.55);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:45;}
@media(min-width:900px){.ef-fab{bottom:32px;right:36px;}}

/* Cards */
.ef-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 2px 10px -6px rgba(32,27,52,0.06);transition:box-shadow .18s ease, transform .18s ease;}
.ef-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.ef-grid-hero{display:grid;grid-template-columns:1fr;gap:16px;}
.ef-grid-two{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:760px){.ef-grid-hero{grid-template-columns:1.5fr 1fr;} .ef-grid-two{grid-template-columns:1fr 1fr;}}

.ef-flexbetween{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.ef-row-gap{display:flex;align-items:center;gap:6px;}
.ef-divider{height:1px;background:var(--border);margin:14px 0;}
.ef-strong{font-weight:600;font-size:13.5px;}
.ef-strike{text-decoration:line-through;color:var(--muted);}
.ef-label-sm{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;}
.ef-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* Badge / progress */
.ef-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.ef-track{width:100%;border-radius:20px;overflow:hidden;margin-top:6px;}
.ef-fill{border-radius:20px;transition:width .4s ease;}
.ef-ring{overflow:visible;}
.ef-ring-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;fill:var(--ink);}

/* Ticket / hero countdown */
.ef-ticket{position:relative;border-top:4px solid var(--indigo);overflow:hidden;}
.ef-ticket-notch{position:absolute;left:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border);}
.ef-ticket-notch-top{top:70px;} .ef-ticket-notch-bottom{bottom:70px;}
.ef-ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.ef-ticket-subject{font-size:22px;font-weight:700;margin:2px 0 4px;}
.ef-ticket-meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.ef-exam-today{display:inline-block;margin-top:14px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px;}
.ef-countdown{display:flex;align-items:center;gap:8px;margin-top:18px;}
.ef-flip{background:var(--ink);border-radius:12px;padding:10px 12px;min-width:56px;text-align:center;display:flex;flex-direction:column;gap:2px;}
.ef-flip-num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#fff;line-height:1;}
.ef-flip-label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#B9B6E0;}
.ef-flip-colon{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--muted);}
.ef-ticket-bottom{display:flex;align-items:center;gap:16px;margin-top:20px;}
.ef-ticket-progress{flex:1;}

/* Motivation card */
.ef-motivation .ef-quote{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin:14px 0 0;line-height:1.35;}
.ef-streak-badge{display:flex;align-items:center;gap:4px;background:var(--amber-soft);color:#92400E;font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px;}

/* Reminder strip */
.ef-reminder-strip{display:flex;align-items:center;gap:10px;background:#FFF7ED;border:1px solid #FDE7C8;color:#92400E;padding:10px 14px;border-radius:14px;font-size:13px;flex-wrap:wrap;}
.ef-reminder-list{display:flex;gap:8px;flex-wrap:wrap;}
.ef-reminder-chip{background:#FFFFFFAA;padding:3px 9px;border-radius:20px;font-weight:600;font-size:12px;}

/* Sessions / rows */
.ef-session-list, .ef-rec-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.ef-session-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface-2);}
.ef-session-row-lg{padding:12px;}
.ef-session-done{opacity:0.55;}
.ef-session-info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.ef-checkbox{width:21px;height:21px;border-radius:7px;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.ef-checkbox-checked{background:var(--green);border-color:var(--green);}
.ef-status-toggle{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;font-weight:700;transition:all .15s ease;}
.ef-status-not_started{color:var(--muted);}
.ef-status-in_progress{background:var(--amber-soft);border-color:var(--amber);color:#B45309;}
.ef-status-completed{background:var(--green);border-color:var(--green);color:#fff;}
.ef-rec-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface-2);}
.ef-rec-rank{width:20px;height:20px;border-radius:6px;background:var(--indigo);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Exam cards */
.ef-examcard{border-top:4px solid var(--indigo);display:flex;flex-direction:column;gap:12px;}
.ef-examcard:hover{box-shadow:0 10px 26px -12px rgba(32,27,52,0.16);transform:translateY(-2px);}
.ef-examcard-done{opacity:0.75;border-top-color:var(--muted) !important;}
.ef-examcard-mid{display:flex;align-items:center;gap:14px;}
.ef-days-left{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;white-space:nowrap;}
.ef-examcard-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;}

/* Syllabus */
.ef-subject-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.ef-subtab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
.ef-subtab-active{background:#fff;}
.ef-chapter-list{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.ef-chapter{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);}
.ef-chapter-main{flex:1;min-width:0;}
.ef-add-chapter{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;}
.ef-add-chapter .ef-input{flex:2;min-width:140px;}
.ef-select{flex:1;min-width:100px;}
.ef-input-num{width:80px;flex:none;}

/* Day strip / planner */
.ef-daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.ef-daychip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;min-width:56px;}
.ef-daychip-active{background:var(--indigo);border-color:var(--indigo);}
.ef-daychip-active .ef-daychip-dow, .ef-daychip-active .ef-daychip-num{color:#fff;}
.ef-daychip-dow{font-size:11px;color:var(--muted);font-weight:600;}
.ef-daychip-num{font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.ef-daychip-today{font-size:8px;text-transform:uppercase;color:var(--amber);font-weight:700;}
.ef-daychip-active .ef-daychip-today{color:#FDE68A;}

/* Progress page */
.ef-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:700px){.ef-stats-grid{grid-template-columns:repeat(4,1fr);}}
.ef-stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.ef-stat-num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
.ef-subject-progress-list{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
.ef-upcoming-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.ef-upcoming-row{display:flex;align-items:center;gap:10px;padding:8px 4px;}

/* Settings */
.ef-toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--border);}
.ef-toggle-row:first-of-type{border-top:none;}
.ef-switch{width:42px;height:24px;border-radius:20px;background:var(--border);border:none;position:relative;cursor:pointer;flex-shrink:0;}
.ef-switch-on{background:var(--indigo);}
.ef-switch-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease;}
.ef-switch-on .ef-switch-knob{left:20px;}

/* Forms */
.ef-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.ef-field-row{display:flex;gap:12px;}
.ef-field-row .ef-field{flex:1;}
.ef-input{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);outline:none;}
.ef-input:focus{border-color:var(--indigo);}
.ef-textarea{resize:vertical;min-height:60px;}
.ef-textarea-sm{min-height:44px;font-size:12.5px;margin-top:6px;}
.ef-segmented{display:flex;gap:6px;}
.ef-seg{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;}
.ef-seg-active{color:#fff;border-color:transparent;}

/* Modal */
.ef-modal-overlay{position:fixed;inset:0;background:rgba(32,27,52,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:ef-fade-in .15s ease;}
.ef-modal{background:#fff;border-radius:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,0.35);animation:ef-modal-in .2s cubic-bezier(.2,.9,.3,1.2);}
@keyframes ef-modal-in{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.ef-modal-wide{max-width:560px;}
.ef-modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 4px;position:sticky;top:0;background:#fff;}
.ef-modal-head h3{font-size:17px;}
.ef-modal-body{padding:16px 20px 22px;}

/* Quick study */
.ef-qs-timer{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin:18px auto;}
.ef-qs-time{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;}
.ef-qs-done{text-align:center;padding:10px 0;}

/* Empty state */
.ef-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:36px 10px;text-align:center;}
.ef-empty-title{font-weight:600;font-size:14px;color:var(--ink-soft);}
.ef-empty-sub{font-size:12.5px;color:var(--muted);}

/* Toast */
.ef-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);box-shadow:0 12px 30px -12px rgba(0,0,0,0.25);padding:10px 16px;border-radius:30px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:90;}
@media(min-width:900px){.ef-toast{bottom:28px;}}

/* Perks bar */
.ef-accountbar{max-width:1180px;margin:0 auto;padding:0 0 4px;}
.ef-accountbar-inner{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:6px 0 4px;}
.ef-user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:30px;background:var(--surface-2);}
.ef-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ef-user-info{display:flex;flex-direction:column;line-height:1.2;}

/* Auth */
.ef-auth-error{display:flex;align-items:center;gap:6px;background:var(--red-soft);color:#B91C1C;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:10px;margin-bottom:12px;}
.ef-spin{animation:ef-spin 0.8s linear infinite;}
@keyframes ef-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* Achievements */
.ef-achv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
@media(min-width:700px){.ef-achv-grid{grid-template-columns:repeat(4,1fr);}}
.ef-achv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 8px;border-radius:14px;background:var(--surface-2);opacity:0.55;}
.ef-achv-earned{opacity:1;background:linear-gradient(160deg,#FFF7ED,#FEF3C7);}
.ef-achv-icon{font-size:22px;line-height:1;}
.ef-achv-title{font-size:12px;font-weight:700;}
.ef-achv-desc{font-size:10.5px;color:var(--muted);line-height:1.3;}

/* Smart import */
.ef-import-card{background:linear-gradient(160deg,#FFFFFF,#F7F5FF);border-color:#E2DEFB;}
.ef-import-locked{text-align:left;}
.ef-import-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;}
.ef-import-emoji{font-size:26px;line-height:1;}
.ef-import-uploads{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
@media(min-width:600px){.ef-import-uploads{grid-template-columns:1fr 1fr;}}
.ef-upload-slot{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:18px 12px;border-radius:14px;border:1.5px dashed var(--border);background:#fff;cursor:pointer;}
.ef-upload-slot:hover{border-color:var(--indigo);}

/* Review modal */
.ef-review-list{display:flex;flex-direction:column;gap:14px;max-height:50vh;overflow-y:auto;padding-right:2px;}
.ef-review-subject{border:1.5px solid var(--border);border-radius:14px;padding:14px;background:var(--surface-2);}
.ef-review-subject-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.ef-review-name{flex:1;font-weight:700;}
.ef-review-warn{font-size:11.5px;color:#B45309;margin:-8px 0 10px;}
.ef-review-topics{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.ef-review-topic-row{display:flex;align-items:center;gap:6px;}
.ef-input-sm{padding:7px 10px;font-size:13px;}
.ef-review-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;border-top:1px solid var(--border);padding-top:14px;}

/* Missed tasks */
.ef-missed-banner{border-color:#FED7AA;background:#FFF7ED;}

/* Auth */
.ef-auth-error{display:flex;align-items:center;gap:6px;background:var(--red-soft);color:#B91C1C;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:10px;margin-bottom:12px;}
.ef-spin{animation:ef-spin .8s linear infinite;}
@keyframes ef-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* Recommend card (dashboard) */
.ef-recommend-card{background:linear-gradient(160deg,#FFFFFF,#F7F5FF);border-color:#E2DEFB;}
.ef-recommend-title{font-size:19px;font-weight:700;margin:6px 0 0;}
.ef-recommend-body{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}

/* Landing page */
.ef-app-landing{min-height:100vh;background:var(--bg);}
.ef-landing{max-width:1080px;margin:0 auto;padding:0 24px 80px;}
.ef-landing-nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;}
.ef-hero{text-align:center;padding:40px 0 20px;}
.ef-hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:700;margin:10px 0 14px;line-height:1.1;}
.ef-hero-sub{font-size:16px;color:var(--ink-soft);max-width:520px;margin:0 auto 26px;line-height:1.5;}
.ef-hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;}
.ef-hero-preview{max-width:640px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:0 30px 60px -30px rgba(32,27,52,0.25);}
.ef-hero-preview-head{display:flex;gap:6px;padding:12px 14px;background:var(--surface-2);}
.ef-hero-preview-body{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:22px;background:#fff;}
.ef-hero-preview-card{text-align:left;}
.ef-hero-preview-num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--indigo);margin:2px 0;}
.ef-landing-section{padding:52px 0;border-top:1px solid var(--border);}
.ef-landing-h2{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;text-align:center;margin:0 0 28px;}
.ef-benefits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(min-width:700px){.ef-benefits-grid{grid-template-columns:repeat(4,1fr);}}
.ef-benefit{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;background:var(--surface-2);}
.ef-steps-row{display:flex;flex-direction:column;gap:10px;max-width:440px;margin:0 auto;}
.ef-step-chip{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600;}
.ef-step-num{width:26px;height:26px;border-radius:50%;background:var(--indigo);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ef-features-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:700px){.ef-features-grid{grid-template-columns:repeat(3,1fr);}}
.ef-feature-card{padding:18px;border-radius:14px;border:1px solid var(--border);background:#fff;}
.ef-landing-final{text-align:center;padding:60px 0 20px;}
.ef-landing-final .ef-landing-h2{margin-bottom:20px;}
